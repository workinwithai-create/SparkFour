<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SparkFour — Live Spark Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>SparkFour</h1>
    <p>Four-bar live spark desk. FluidR3 chairs add hat patterns, snare ghosts, bass fills, and piano stabs so a static loop has life.</p>
  </header>
  <div id="status">Tap Play to start audio</div>
  <div class="controls">
    <label>BPM <input type="number" id="bpm" min="60" max="180" value="98"></label>
    <label>Key <select id="key">
      <option>A minor</option>
      <option>C major</option>
      <option>G major</option>
      <option>D minor</option>
      <option>E minor</option>
      <option>F major</option>
    </select></label>
    <label>Chords <input type="text" id="chords" value="Am F C G" placeholder="Am F C G"></label>
  </div>
  <div id="recipes" class="recipes"></div>
  <div id="bars" class="bars"></div>
  <div class="actions">
    <button id="play">Play</button>
    <button id="stop">Stop</button>
    <button id="exportWav">Export WAV</button>
    <button id="exportMid">Export MIDI</button>
    <button id="copy">Copy punch list</button>
  </div>
  <pre id="punch"></pre>
  <footer>
    <p>Free. Samples pinned. Grid-perfect WAV + MIDI. Silent switch mutes Web Audio on iOS.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
